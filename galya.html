<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галя — стеклянная бабочка</title>
<meta name="description" content="Галя живёт на сайте, следит за курсором, пьёт кофе и спит по московскому времени.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icons/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/Onest-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/galya.css?v=20261019">

<!-- Галя построена на three.js. Версию не поднимать: модуль проверен на r165. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "delaunator": "https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm"
} }
</script>
</head>
<body>

<header class="header">
  <nav class="header__nav">
    <ul class="header__nav-list">
      <li><a href="index.html" class="header__nav-link header__nav-link--back" aria-label="На главную">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a></li>
      <li><span class="header__nav-link header__nav-link--current" aria-current="page">Галя</span></li>
    </ul>
  </nav>

  <a href="index.html" class="btn btn--glass header__back-short">На главную</a>

  <a href="https://t.me/qualcunodai" target="_blank" rel="noopener" data-goal="header_cta" class="btn btn--glass header__cta">
    <span class="header__cta-long">Заказать дизайн</span>
    <span class="header__cta-short">Заказать</span>
  </a>
</header>

<main class="gp">

  <div class="gp__intro">
    <h1 class="gp__title">Галя</h1>
    <p class="gp__tagline">хранительница доменного очага</p>
  </div>

  <!-- На большом экране Галя занимает весь экран, а панели лежат поверх неё -->
  <div class="gp__stage" id="gpStage">
    <!-- пока строится сетка крыльев -->
    <div class="gp__loader" id="gpLoader" role="status" aria-label="Галя собирается"></div>
    <!-- запасной вариант, если WebGL недоступен -->
    <img class="gp__fallback" id="gpFallback" src="assets/galya/galya-fallback.png"
         alt="Галя, стеклянная бабочка" width="512" height="512" hidden>
    <div class="gp__canvas" id="galya" aria-label="Галя, стеклянная бабочка"></div>

    <!-- искра: прыгает рядом и ждёт, успеешь ли -->
    <button type="button" class="gp__spark" id="gpSpark" hidden aria-label="Поймать искру"></button>
  </div>

  <div class="gp__bubble" id="gpBubble" role="status" aria-live="polite" hidden></div>

  <!-- Левая колонка: всё, чем Галю трогают -->
  <div class="gp__controls">
    <!-- если доклацаться — Галя уходит, и зовут её обратно отсюда -->
    <button type="button" class="btn btn--pink gp__sorry" id="gpSorry" hidden>Попросить прощения у Гали</button>

    <p class="gp__status" id="gpStatus">У Гали сейчас…</p>

    <div class="gp__actions">
      <button type="button" class="btn btn--pink gp__btn" id="gpPet">Погладить</button>
      <button type="button" class="btn btn--glass gp__btn" id="gpCoffee">Налить кофе</button>
      <button type="button" class="btn btn--glass gp__btn" id="gpFeed"
              aria-expanded="false" aria-controls="gpFood">Покормить</button>
      <button type="button" class="gp__theme" id="gpTheme" role="switch" aria-checked="false"
              aria-label="Светлый фон">
        <span class="gp__theme-knob"></span>
      </button>
    </div>

    <p class="gp__note">С ней можно поиграть.</p>

    <!-- Тюнинг: только с компьютера, на телефоне ползунками не покрутишь -->
    <button type="button" class="gp__tune-btn" id="gpTuneBtn" aria-expanded="false" aria-controls="gpTune">Тюнинг Гали</button>
  </div>

  <div class="gp__tune" id="gpTune" hidden>
    <label class="gp__sl">
      <span class="gp__sl-name">Размер бабочки</span>
      <input type="range" data-tune="size" min="70" max="115" step="1" value="100">
      <output class="gp__sl-val">100%</output>
    </label>
    <label class="gp__sl">
      <span class="gp__sl-name">Размер глаз</span>
      <input type="range" data-tune="eyes" min="20" max="60" step="1" value="38">
      <output class="gp__sl-val">0.38</output>
    </label>
    <label class="gp__sl">
      <span class="gp__sl-name">Ширина улыбки</span>
      <input type="range" data-tune="smile" min="4" max="20" step="1" value="10">
      <output class="gp__sl-val">0.10</output>
    </label>
    <label class="gp__sl">
      <span class="gp__sl-name">Экспозиция</span>
      <input type="range" data-tune="exposure" min="40" max="160" step="1" value="92">
      <output class="gp__sl-val">0.92</output>
    </label>
    <label class="gp__sl">
      <span class="gp__sl-name">Свечение</span>
      <input type="range" data-tune="glow" min="0" max="250" step="1" value="107">
      <output class="gp__sl-val">1.07</output>
    </label>

    <div class="gp__tune-foot">
      <button type="button" class="gp__tune-reset" id="gpTuneReset">Вернуть как было</button>
      <span class="gp__tune-hint" id="gpTuneHint"></span>
    </div>
  </div>


  <!-- Кормление: карточки выбираются галочками, потом еда летит Гале в рот -->
  <div class="gp__food" id="gpFood" hidden>
    <p class="gp__food-title">Чем угостим?</p>

    <div class="gp__food-grid">
      <label class="gpf">
        <input type="checkbox" class="gpf__box" value="yogurt">
        <span class="gpf__card">
          <span class="gpf__pic"><img src="assets/food/yogurt.webp" alt="" width="312" height="182" loading="lazy" decoding="async"></span>
          <span class="gpf__name">Греческий йогурт</span>
        </span>
      </label>
      <label class="gpf">
        <input type="checkbox" class="gpf__box" value="hinkal">
        <span class="gpf__card">
          <span class="gpf__pic"><img src="assets/food/hinkal.webp" alt="" width="420" height="242" loading="lazy" decoding="async"></span>
          <span class="gpf__name">Хинкал</span>
        </span>
      </label>
      <label class="gpf">
        <input type="checkbox" class="gpf__box" value="bueno">
        <span class="gpf__card">
          <span class="gpf__pic"><img src="assets/food/bueno.webp" alt="" width="420" height="420" loading="lazy" decoding="async"></span>
          <span class="gpf__name">Киндер Буэно</span>
        </span>
      </label>
      <label class="gpf">
        <input type="checkbox" class="gpf__box" value="pasta">
        <span class="gpf__card">
          <span class="gpf__pic"><img src="assets/food/pasta.webp" alt="" width="420" height="293" loading="lazy" decoding="async"></span>
          <span class="gpf__name">Паста с креветками</span>
        </span>
      </label>
      <label class="gpf">
        <input type="checkbox" class="gpf__box" value="borsch">
        <span class="gpf__card">
          <span class="gpf__pic"><img src="assets/food/borsch.webp" alt="" width="420" height="254" loading="lazy" decoding="async"></span>
          <span class="gpf__name">Борщ</span>
        </span>
      </label>
      <label class="gpf">
        <input type="checkbox" class="gpf__box" value="buter">
        <span class="gpf__card">
          <span class="gpf__pic"><img src="assets/food/buter.webp" alt="" width="420" height="291" loading="lazy" decoding="async"></span>
          <span class="gpf__name">Бутерброды</span>
        </span>
      </label>
      <label class="gpf">
        <input type="checkbox" class="gpf__box" value="banan">
        <span class="gpf__card">
          <span class="gpf__pic"><img src="assets/food/banan.webp" alt="" width="360" height="303" loading="lazy" decoding="async"></span>
          <span class="gpf__name">Бананы</span>
        </span>
      </label>
      <button type="button" class="gpf gpf--add" id="gpFoodAdd">
        <span class="gpf__card gpf__card--add">
          <span class="gpf__pic gpf__pic--add" aria-hidden="true">+</span>
          <span class="gpf__name">Предложить своё</span>
        </span>
      </button>
    </div>

    <button type="button" class="btn btn--pink gp__food-go" id="gpFeedGo">Угостить</button>
  </div>

  <!-- Показывается, если сеть отвалилась или машина не тянет -->
  <div class="gp__sos" id="gpSos" role="alert" hidden>
    <p class="gp__sos-text">Я не могу существовать в таких условиях. Оплатите интернет или перезайдите с компьютера.</p>
    <a href="index.html" class="btn btn--dark gp__sos-btn">На главную</a>
  </div>

</main>

<!-- Своё блюдо: форма Яндекса, ответы копятся у Марины в таблице -->
<dialog class="gpd" id="gpFormDlg" aria-label="Предложить блюдо для Гали">
  <div class="gpd__panel">
    <button type="button" class="gpd__close" id="gpFormClose" aria-label="Закрыть">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <iframe class="gpd__frame" id="gpFormFrame" title="Форма: предложить блюдо для Гали"
            src="about:blank" frameborder="0" name="ya-form-6ad71f186d2d7383f2a5a95b"></iframe>
  </div>
</dialog>

<!-- летящая чашка -->
<div class="gp__cup" id="gpCup" aria-hidden="true" hidden>☕</div>

<script type="module" src="js/galya-page.js?v=20261019"></script>
<script src="js/analytics.js?v=20261019"></script>
</body>
</html>
