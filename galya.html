<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Галя — стеклянная бабочка</title>
<meta name="description" content="Галя живёт на сайте, следит за курсором, пьёт кофе и спит по московскому времени.">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="assets/icons/favicon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/Onest-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="css/galya.css?v=20261018">

<!-- Галя построена на three.js. Версию не поднимать: модуль проверен на r165. -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
  "delaunator": "https://cdn.jsdelivr.net/npm/delaunator@5.0.1/+esm"
} }
</script>
</head>
<body>

<header class="header">
  <nav class="header__nav">
    <ul class="header__nav-list">
      <li><a href="index.html" class="header__nav-link">На главную</a></li>
      <li><a href="index.html#services" class="header__nav-link">Услуги</a></li>
      <li><a href="index.html#portfolio" class="header__nav-link">Кейсы</a></li>
      <li><a href="designers.html" class="header__nav-link">Дизайнерам</a></li>
      <li><a href="soon.html" class="header__nav-link header__nav-link--soon" title="Туториалы по ИИ — скоро">Soon...</a></li>
      <li><span class="header__nav-link header__nav-link--current" aria-current="page">Галя</span></li>
    </ul>
  </nav>

  <a href="index.html" class="btn btn--glass header__back-short">На главную</a>

  <a href="https://t.me/qualcunodai" target="_blank" rel="noopener" data-goal="header_cta" class="btn btn--glass header__cta">
    <span class="header__cta-long">Заказать дизайн</span>
    <span class="header__cta-short">Заказать</span>
  </a>
</header>

<main class="gp">

  <div class="gp__intro">
    <h1 class="gp__title">Галя</h1>
    <p class="gp__tagline">хранительница доменного очага</p>
  </div>

  <!-- Контейнеру нужен явный размер: Галя заполняет его целиком -->
  <div class="gp__stage" id="gpStage">
    <!-- пока строится сетка крыльев -->
    <div class="gp__loader" id="gpLoader" role="status" aria-label="Галя собирается"></div>
    <!-- запасной вариант, если WebGL недоступен -->
    <img class="gp__fallback" id="gpFallback" src="assets/galya/galya-fallback.png"
         alt="Галя, стеклянная бабочка" width="512" height="512" hidden>
    <div class="gp__canvas" id="galya" aria-label="Галя, стеклянная бабочка"></div>
  </div>

  <div class="gp__bubble" id="gpBubble" role="status" aria-live="polite" hidden></div>

  <p class="gp__status" id="gpStatus">У Гали сейчас…</p>

  <div class="gp__actions">
    <button type="button" class="btn btn--pink gp__btn" id="gpPet">Погладить</button>
    <button type="button" class="btn btn--glass gp__btn" id="gpCoffee">Налить кофе</button>
    <button type="button" class="gp__theme" id="gpTheme" role="switch" aria-checked="false"
            aria-label="Светлый фон">
      <span class="gp__theme-knob"></span>
    </button>
  </div>

  <p class="gp__note">С ней можно поиграть.</p>

  <!-- Тюнинг: только с компьютера, на телефоне ползунками не покрутишь -->
  <button type="button" class="gp__tune-btn" id="gpTuneBtn" aria-expanded="false" aria-controls="gpTune">Тюнинг Гали</button>

  <div class="gp__tune" id="gpTune" hidden>
    <label class="gp__sl">
      <span class="gp__sl-name">Размер бабочки</span>
      <input type="range" data-tune="size" min="70" max="140" step="1" value="100">
      <output class="gp__sl-val">100%</output>
    </label>
    <label class="gp__sl">
      <span class="gp__sl-name">Размер глаз</span>
      <input type="range" data-tune="eyes" min="20" max="60" step="1" value="38">
      <output class="gp__sl-val">0.38</output>
    </label>
    <label class="gp__sl">
      <span class="gp__sl-name">Ширина улыбки</span>
      <input type="range" data-tune="smile" min="4" max="20" step="1" value="10">
      <output class="gp__sl-val">0.10</output>
    </label>
    <label class="gp__sl">
      <span class="gp__sl-name">Экспозиция</span>
      <input type="range" data-tune="exposure" min="40" max="160" step="1" value="92">
      <output class="gp__sl-val">0.92</output>
    </label>
    <label class="gp__sl">
      <span class="gp__sl-name">Свечение</span>
      <input type="range" data-tune="glow" min="0" max="250" step="1" value="107">
      <output class="gp__sl-val">1.07</output>
    </label>

    <div class="gp__tune-foot">
      <button type="button" class="gp__tune-reset" id="gpTuneReset">Вернуть как было</button>
      <span class="gp__tune-hint" id="gpTuneHint"></span>
    </div>
  </div>

  <!-- Показывается, если сеть отвалилась или машина не тянет -->
  <div class="gp__sos" id="gpSos" role="alert" hidden>
    <p class="gp__sos-text">Я не могу существовать в таких условиях. Оплатите интернет или перезайдите с компьютера.</p>
    <a href="index.html" class="btn btn--dark gp__sos-btn">На главную</a>
  </div>

</main>

<!-- летящая чашка -->
<div class="gp__cup" id="gpCup" aria-hidden="true" hidden>☕</div>

<script type="module" src="js/galya-page.js?v=20261018"></script>
<script src="js/analytics.js?v=20261018"></script>
</body>
</html>
